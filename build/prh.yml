version: 1
rules:
  - expected: アンシリアライズ
    pattern:
      - デシリアライズ
      - アンマーシャリング

  - expected: シリアライズ
    pattern: マーシャリング

  - expected: static $1
    pattern: /静的な?(変数|メソッド|プロパティ)/
    specs:
      - from: 静的変数
        to: static 変数
      - from: 静的メソッド
        to: static メソッド
      - from: 静的なプロパティ
        to: static プロパティ
      - from: 遅延静的束縛
        to: 遅延静的束縛

  - expected: $1スローする
    pattern: /((?:例外|Exception|Error|Throwable) ?を)投げる/
    specs:
      - from: 例外を投げる
        to: 例外をスローする
      - from: Exceptionを投げる
        to: Exceptionをスローする
      - from: TypeError を投げる
        to: TypeError をスローする

  - expected: $1スローし$2
    pattern: /((?:例外|Exception|Error|Throwable) ?を)投げ(て|た|ま[しすせ])/
    specs:
      - from: 例外を投げます
        to: 例外をスローします
      - from: Exceptionを投げて
        to: Exceptionをスローして
      - from: TypeError を投げた
        to: TypeError をスローした

  - expected: $1スローされ
    pattern: /((?:例外|Exception|Error|Throwable) ?が)投げられ/
    specs:
      - from: 例外が投げられて
        to: 例外がスローされて
      - from: Exceptionが投げられます
        to: Exceptionがスローされます
      - from: TypeError が投げられた
        to: TypeError がスローされた

  - expected: サーバー
    pattern: /サーバ(?!ー)/
    specs:
      - from: サーバ
        to: サーバー
      - from: サーバー
        to: サーバー

  - expected: オーバーライド
    pattern: /オーバ(?!ー)ライド/
    specs:
      - from: オーバライド
        to: オーバーライド
      - from: オーバーライド
        to: オーバーライド

  - expected: WHATWG URL Standard
    pattern: WHATWG URL 標準
    prh: URL 仕様の固有名詞なので原語のままにする
    specs:
      - from: WHATWG URL 標準
        to: WHATWG URL Standard
      - from: WHATWG URL Standard
        to: WHATWG URL Standard

  - expected: ファイルディスクリプタ
    pattern: ファイル記述子
    specs:
      - from: ファイル記述子
        to: ファイルディスクリプタ

  - expected: パラメータ
    pattern: パラメーター
    prh: 既存の訳文の多数派に合わせて長音を付けない
    specs:
      - from: パラメーター
        to: パラメータ

  - expected: パーサー
    pattern: /パーサ(?!ー)/
    prh: 「サーバー」に合わせて長音を付ける
    specs:
      - from: パーサ
        to: パーサー
      - from: パーサー
        to: パーサー

  - expected: イテレータ
    pattern: イテレーター
    prh: 既存の訳文の多数派に合わせて長音を付けない
    specs:
      - from: イテレーター
        to: イテレータ

  - expected: ジェネレータ
    pattern: ジェネレーター
    prh: 既存の訳文の多数派に合わせて長音を付けない
    specs:
      - from: ジェネレーター
        to: ジェネレータ

  - expected: 致命的なエラー
    pattern: /[Ff]atal ?エラー/
    specs:
      - from: fatal エラー
        to: 致命的なエラー
      - from: Fatalエラー
        to: 致命的なエラー

  - expected: 致命的なエラー
    pattern: /[Ff]atal error(?= ?[ぁ-んァ-ヶー一-龠々、。])/
    prh: 日本語の文中の fatal error を検出している。PHP の出力やコード中の英語はそのままにする
    specs:
      - from: fatal error が発生します
        to: 致命的なエラー が発生します
      - from: キャッチ可能な fatal error ではなく
        to: キャッチ可能な 致命的なエラー ではなく
      - from: "Fatal error: Uncaught Error"
        to: "Fatal error: Uncaught Error"
      - from: a fatal error has occurred
        to: a fatal error has occurred
      - from: 致命的なエラー (fatal error)
        to: 致命的なエラー (fatal error)
